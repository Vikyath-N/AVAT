# MCP Client Configuration
# Set these via wrangler secret put
# CLOUDFLARE_API_TOKEN = "your_api_token"
# CLOUDFLARE_ACCOUNT_ID = "your_account_id"

# KV namespace binding for AVAT data
[[env.production.kv_namespaces]]
binding = "AVAT_KV"
id = "your_kv_namespace_id"
preview_id = "your_kv_preview_id"

# D1 Database for MCP server (optional)
[[env.production.d1_databases]]
binding = "AVAT_D1"
database_name = "avat-d1"
database_id = "your_d1_database_id"

# R2 Storage for MCP server (optional)
[[env.production.r2_buckets]]
binding = "AVAT_R2"
bucket_name = "avat-r2"

# Development environment (optional)
[env.preview]
# Same secrets as production but for testing

# Cron triggers for scheduled jobs
# See: https://developers.cloudflare.com/workers/configuration/cron-triggers/
[triggers]
crons = [
  # Daily DMV scraper at 5:00 AM UTC
  "0 5 * * *"
]

# Local development
[env.local]
# Same configuration for local testing
