name = "avat-backend"
main = "src/index.js"
compatibility_date = "2024-09-02"
account_id = "e3f5eea8cbc9a489d43c2790bcf97a45"

# Production environment
[env.production]
# Set these in Cloudflare dashboard or via wrangler secret put
# Neon PostgreSQL Database
DATABASE_URL = "postgresql://user:password@host/database?sslmode=require"
# SUPABASE_URL = "your_supabase_url"
# SUPABASE_ANON_KEY = "your_supabase_anon_key"
UPSTASH_REDIS_REST_URL = "https://your-redis.upstash.io"
UPSTASH_REDIS_REST_TOKEN = "your_upstash_token"

# MCP Client Configuration
# Set these via wrangler secret put
# CLOUDFLARE_API_TOKEN = "your_api_token"
# CLOUDFLARE_ACCOUNT_ID = "your_account_id"

# Database configuration
[[env.production.kv_namespaces]]
binding = "AVAT_KV"
id = "your_kv_namespace_id"
preview_id = "your_kv_preview_id"

# D1 Database for MCP server (optional)
[[env.production.d1_databases]]
binding = "AVAT_D1"
database_name = "avat-d1"
database_id = "your_d1_database_id"

# R2 Storage for MCP server (optional)
[[env.production.r2_buckets]]
binding = "AVAT_R2"
bucket_name = "avat-r2"

# Development environment (optional)
[env.preview]
# Same secrets as production but for testing

# Cron triggers for scheduled jobs
[triggers]
crons = [
  # Daily DMV index sync at 3:00 UTC
  "0 3 * * *",
  # Daily PDF sync at 3:10 UTC (10 minutes after index sync)
  "10 3 * * *"
]

# Local development
[env.local]
# Same configuration for local testing
